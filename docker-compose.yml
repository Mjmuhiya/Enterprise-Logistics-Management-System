services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logiflow
      POSTGRES_USER: logiflow
      POSTGRES_PASSWORD: logiflow_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/V1__initial_schema.sql:/docker-entrypoint-initdb.d/V1__initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logiflow -d logiflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://logiflow:logiflow_dev_only@db:5432/logiflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
